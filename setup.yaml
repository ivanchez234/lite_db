# Надёжность журнала предзаписи:
#   none  - только буфер процесса, не переживает даже его падения
#   flush - отдаём ядру, переживает падение процесса, но не потерю питания
#   full  - fsync, переживает потерю питания, но заметно медленнее
wal_sync: full

tables:
  - name: use
    schema:
      - name: STRING
      - age: INT
      - is_active: BOOL
  - name: products
    schema:
      - title: STRING
      - price: DOUBLE
  - name: prod
    schema:
      - title: STRING
      - price: DOUBLE
      - sale: DOUBLE
  - name: events
    schema:
      - title: STRING
      - event_date: DATE